name: Desplegar en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generar configuración
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          CONFIG_SUFFIX: pages
        run: |
          python generarconfiguracion.py

      # La base (/repositorio/) ya NO se reescribe aquí: cada HTML la calcula
      # en el navegador (ver el <script> del <head> que define window.APP_BASE).
      # Este paso solo comprueba que no se ha colado ninguna ruta rota.
      - name: Verificar rutas antes de publicar
        run: |
          python - <<'PY'
          import re, sys
          from html.parser import HTMLParser
          from pathlib import Path

          ATTRS = {"src", "href"}
          EXTERNAS = ("http://", "https://", "//", "#", "data:", "mailto:", "javascript:")

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  if tag in ("a", "base"):
                      return
                  for k, v in attrs:
                      if k in ATTRS and v:
                          self.refs.append(v)

          errores = []
          for html in ("index.html",
                       "paginas/visores/administrador/paneladministrador.html",
                       "paginas/visores/administrador/iniciarsesion.html"):
              texto = Path(html).read_text(encoding="utf-8")
              if re.search(r'<base\s+href="/"\s*/?>', texto):
                  errores.append(f"{html}: <base href=\"/\"> estático (debe calcularse en el navegador)")
              if "window.APP_BASE" not in texto:
                  errores.append(f"{html}: falta el script que define window.APP_BASE")
              p = P(); p.feed(texto)
              for ref in p.refs:
                  if ref.startswith(EXTERNAS) or ref.startswith("/favicon") or ref.startswith("/apple-touch"):
                      continue
                  if ref.startswith("/"):
                      errores.append(f"{html}: ruta absoluta que ignora la base: {ref}")
                      continue
                  ruta = Path(ref.split("?")[0].split("#")[0])
                  if not ruta.exists():
                      errores.append(f"{html}: no existe {ref}")

          if errores:
              print("\n".join(errores)); sys.exit(1)
          print("OK: recursos referenciados existen y no hay rutas absolutas")
          PY

      - name: Comprobar configuración generada
        run: |
          test -f js/SUPABASETOKEN_pages.js
          echo "Configuración generada correctamente"

      - name: Subir archivos a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
