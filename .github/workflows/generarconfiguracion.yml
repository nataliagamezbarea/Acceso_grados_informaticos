name: Desplegar en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  desplegar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generar configuración
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          CONFIG_SUFFIX: pages
        run: |
          python generarconfiguracion.py

      - name: Comprobar configuración generada
        run: |
          test -f js/SUPABASETOKEN_pages.js
          echo "Configuración generada correctamente"

      - name: Subir archivos a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar en Pages
        uses: actions/deploy-pages@v4