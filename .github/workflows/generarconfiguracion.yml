name: Desplegar en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  desplegar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generar configuración
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          CONFIG_SUFFIX: pages
        run: |
          python generarconfiguracion.py

      - name: Preparar base de GitHub Pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python - <<'PY2'
          import os
          from pathlib import Path

          base = os.environ.get("PAGES_BASE_PATH", "/") or "/"
          if not base.startswith("/"):
              base = "/" + base
          if not base.endswith("/"):
              base += "/"

          root = Path(".")
          for path in root.rglob("*.html"):
              if ".git" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8")
              new = text.replace('<base href="/">', f'<base href="{base}">')
              new = new.replace("<base href='/'>", f"<base href='{base}'>")
              if new != text:
                  path.write_text(new, encoding="utf-8")
                  print(f"Base Pages: {path} -> {base}")
          PY2

      - name: Comprobar configuración generada
        run: |
          test -f js/SUPABASETOKEN_pages.js
          echo "Configuración generada correctamente"

      - name: Subir archivos a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar en Pages
        uses: actions/deploy-pages@v4