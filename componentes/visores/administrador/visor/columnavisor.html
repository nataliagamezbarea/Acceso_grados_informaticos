<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
 
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
 <link href="css/notificador.css" rel="stylesheet"/>
</head>
 <body>
  <visor-columna data-component="columna-visor">
   <template shadowrootmode="open">
    <slot>
    </slot>
   </template>
   <div class="ovcol">
    <div class="col-header orig" id="headerViewerOld">
     <i class="fa-solid fa-file-lines">
     </i>
     1. ORIGINAL (Haz clic sobre enunciado, nombres o colegio para modificar)
    </div>
    <!-- MEN&Uacute; FLOTANTE: ELEGIR QU&Eacute; SE VA A A&Ntilde;ADIR (mismo aspecto que enunciados) -->
    <visor-menu-anadir data-component="menu-anadir">
     <template shadowrootmode="open">
      <slot>
      </slot>
     </template>
     <div class="floating-add-menu" id="modalAnadirTipo">
      <div class="css-inline-015a5e7fbe">
       <b>
        <i class="fa-solid fa-square-plus css-inline-befda3886d">
        </i>
        ¿Qué quieres añadir?
       </b>
       <span class="badge v css-inline-5dbc6fa9a9">
        Zona personalizada
       </span>
      </div>
      <div class="css-inline-c87525adb8">
       <button class="css-inline-82403c4a9c" data-event-click="elegirTipoAnadir('enunciado')">
        <i class="fa-solid fa-pen-fancy">
        </i>
        Sustituir Enunciado
       </button>
       <button class="css-inline-4d1462c150" data-event-click="elegirTipoAnadir('nombre')">
        <i class="fa-solid fa-user-slash">
        </i>
        Borrar Nombre
       </button>
       <button class="css-inline-070db0b6c3" data-event-click="elegirTipoAnadir('colegio')">
        <i class="fa-solid fa-school">
        </i>
        Borrar Colegio/Logo
       </button>
       <button class="css-inline-82b57a9ceb" data-event-click="elegirTipoAnadir('reflujo')" id="btnAnadirReflujo">
        <i class="fa-solid fa-arrows-up-to-line">
        </i>
        Subir si hay Imágenes
       </button>
       <button class="css-inline-78843b00be" data-event-click="cerrarSelectorAnadir()">
        <i class="fa-solid fa-xmark">
        </i>
        Cerrar
       </button>
      </div>
     </div>
    </visor-menu-anadir>
    <!-- MEN&Uacute; FLOTANTE SOBRE EL DOCUMENTO (ENUNCIADOS) -->
    <visor-menu-enunciado data-component="menu-enunciado">
     <template shadowrootmode="open">
      <slot>
      </slot>
     </template>
     <div class="floating-pdf-menu" id="floatingPdfMenu">
      <div class="css-inline-015a5e7fbe">
       <b>
        <i class="fa-solid fa-gear">
        </i>
        Opciones del Enunciado:
       </b>
       <span class="badge v" id="floatStatusBadge">
        Opciones de Enunciado
       </span>
      </div>
      <div class="css-inline-c87525adb8">
       <button class="css-inline-4d1462c150" data-event-click="editarEnunciadoDesdePopup()">
        <i class="fa-solid fa-pen-to-square">
        </i>
        Editar Enunciado
       </button>
       <button class="css-inline-82403c4a9c" data-event-click="eliminarEnunciadoDesdePopup()" id="btnEliminarEnunciado">
        <i class="fa-solid fa-trash-can">
        </i>
        Eliminar Enunciado
       </button>
       <button class="css-inline-a68719e645" data-event-click="restoreInitialSuggestion();closeEnunciadoPopup()" id="btnRestaurarEnunciado">
        <i class="fa-solid fa-rotate-left">
        </i>
        Volver al de Antes
       </button>
       <button class="css-inline-78843b00be" data-event-click="closeEnunciadoPopup()">
        <i class="fa-solid fa-xmark">
        </i>
        Cerrar
       </button>
      </div>
     </div>
    </visor-menu-enunciado>
    <!-- MEN&Uacute; FLOTANTE SOBRE RECUADROS DE COLEGIO/LOGO -->
    <visor-menu-colegio data-component="menu-colegio">
     <template shadowrootmode="open">
      <slot>
      </slot>
     </template>
     <div class="floating-col-menu" id="floatingColMenu">
      <div class="css-inline-015a5e7fbe">
       <b>
        <i class="fa-solid fa-school css-inline-20679505b4">
        </i>
        Opciones del Colegio:
       </b>
       <span class="badge v" id="floatColBadge">
        Colegio detectado
       </span>
      </div>
      <div class="css-inline-c87525adb8">
       <button class="css-inline-a68719e645" data-event-click="handleColegioAction(true)" id="btnEliminarCol">
        <i class="fa-solid fa-school">
        </i>
        Eliminar Colegio/Logo
       </button>
       <button class="css-inline-e962673576" data-event-click="handleColegioAction(false)" id="btnConservarCol">
        <i class="fa-solid fa-eye">
        </i>
        Conservar Colegio
       </button>
       <button class="css-inline-e8f96255f1" data-event-click="handleColegioAction('eliminar_recuadro')" id="btnBorrarRecuadroCol">
        <i class="fa-solid fa-trash">
        </i>
        Eliminar Recuadro
       </button>
       <button class="css-inline-78843b00be" data-event-click="closeColegioPopup()">
        <i class="fa-solid fa-xmark">
        </i>
        Cerrar
       </button>
      </div>
     </div>
    </visor-menu-colegio>
    <!-- MEN&Uacute; FLOTANTE SOBRE RECUADROS DE NOMBRE (igual que el de enunciados) -->
    <visor-menu-nombre data-component="menu-nombre">
     <template shadowrootmode="open">
      <slot>
      </slot>
     </template>
     <div class="floating-name-menu" id="floatingNameMenu">
      <div class="css-inline-015a5e7fbe">
       <b>
        <i class="fa-solid fa-user-slash css-inline-c73cb88578">
        </i>
        Opciones del Nombre:
       </b>
       <span class="badge v" id="floatNameBadge">
        Nombre detectado
       </span>
      </div>
      <div class="css-inline-c87525adb8">
       <button class="css-inline-4d1462c150" data-event-click="handleNombreAction(true)" id="btnEliminarNombre">
        <i class="fa-solid fa-user-slash">
        </i>
        Eliminar Nombre
       </button>
       <button class="css-inline-a68719e645" data-event-click="handleNombreAction(false)" id="btnConservarNombre">
        <i class="fa-solid fa-user-check">
        </i>
        Conservar Nombre
       </button>
       <button class="css-inline-e8f96255f1" data-event-click="handleNombreAction('eliminar_recuadro')" id="btnBorrarRecuadroNombre">
        <i class="fa-solid fa-trash">
        </i>
        Eliminar Recuadro
       </button>
       <button class="css-inline-78843b00be" data-event-click="closeNombrePopup()">
        <i class="fa-solid fa-xmark">
        </i>
        Cerrar
       </button>
      </div>
     </div>
    </visor-menu-nombre>
    <!-- MEN&Uacute; FLOTANTE SOBRE IM&Aacute;GENES -->
    <visor-menu-imagen data-component="menu-imagen">
     <template shadowrootmode="open">
      <slot>
      </slot>
     </template>
     <div class="floating-img-menu" id="floatingImgMenu">
      <div class="css-inline-015a5e7fbe">
       <b>
        <i class="fa-solid fa-image css-inline-fd58244ac9">
        </i>
        Opciones de Imagen:
       </b>
      </div>
      <div class="css-inline-c87525adb8">
       <button class="css-inline-5192b201c4" data-event-click="checkSelectedImageInternet()" id="btnCheckInternet">
        <i class="fa-solid fa-globe">
        </i>
        Comprobar / Borrar si no está en Internet
       </button>
       <label class="css-inline-1cc923efed" id="lblExcepcionInternet">
        <input data-event-change="toggleExcepcionInternet(this.checked)" id="cbNoBorrarInternet" type="checkbox"/>
        <i class="fa-solid fa-shield-halved">
        </i>
        No borrar si no está en Internet
       </label>
       <button class="css-inline-0e718c5572" data-event-click="handleImageAction('conservar', {global:true, no_borrar:true})" id="btnConservarImgGlobal" title="Conserva esta imagen en todos los PDFs donde aparezca igual, aunque no esté en Internet">
        <i class="fa-solid fa-shield-halved">
        </i>
        Conservar aunque no esté en Internet
       </button>
       <button class="css-inline-82403c4a9c" data-event-click="handleImageAction('borrar')" id="btnBorrarImg">
        <i class="fa-solid fa-trash-can">
        </i>
        Borrar Imagen
       </button>
       <button class="css-inline-f6b4cacf8e" data-event-click="handleImageAction('borrar', {global:true})" id="btnBorrarImgGlobal" title="Marca esta imagen para que se elimine POR DEFECTO en todos los PDFs donde aparezca literalmente igual">
        <i class="fa-solid fa-trash-arrow-up">
        </i>
        Borrar y también en otros PDFs
       </button>
       <button class="css-inline-2fa08c3aa4" data-event-click="triggerUploadImage()" id="btnReemplazarImg">
        <i class="fa-solid fa-arrow-up-from-bracket">
        </i>
        Reemplazar por otra Imagen...
       </button>
       <button class="css-inline-a68719e645" data-event-click="handleImageAction('restaurar')" id="btnRestaurarImg">
        <i class="fa-solid fa-rotate-left">
        </i>
        Restaurar Original
       </button>
       <button class="css-inline-78843b00be" data-event-click="closeImgPopup()">
        <i class="fa-solid fa-xmark">
        </i>
        Cerrar
       </button>
      </div>
      <input accept="image/*" class="css-inline-6b99de8b69" data-event-change="uploadImageFile(this)" id="inputImageFile" type="file"/>
     </div>
    </visor-menu-imagen>
    <visor-documento-original data-component="documento-original">
     <template shadowrootmode="open">
      <slot>
      </slot>
     </template>
     <div class="doc-viewer" id="viewerOld">
     </div>
    </visor-documento-original>
   </div>
  </visor-columna>
 <script src="../../../../js/descargas/notificador.js?v=20260911-0930"></script>
</body>
</html>
