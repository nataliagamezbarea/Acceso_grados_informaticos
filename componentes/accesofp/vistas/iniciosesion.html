<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
 
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
 <link href="css/notificador.css" rel="stylesheet"/>
</head>
 <body>
  <app-view-login data-app-component="login">
   <template shadowrootmode="open">
    <slot>
    </slot>
   </template>
   <section class="app-vista vista-estabilizada" data-app-view="login" hidden="">
    <template shadowrootmode="open">
     <link data-dsd-shell-css="1" href="/css/componentes/carcasasombra.css" rel="stylesheet">
      <slot>
      </slot>
     </link>
    </template>
    <login-form data-component="login-form">
     <template shadowrootmode="open">
      <slot>
      </slot>
     </template>
     <main class="login-contenedor">
      <div class="login-tarjeta">
       <div class="login-emoji">
        💻
       </div>
       <h1>
        Acceso al aula
       </h1>
       <p class="login-sub">
        Identifícate para acceder
       </p>
       <form id="form-login" novalidate="">
        <label for="login-email">
         Email
        </label>
        <input autocomplete="email" id="login-email" placeholder="tu@correo.com" required="" type="email"/>
        <label for="login-password">
         Contraseña
        </label>
        <input autocomplete="current-password" id="login-password" placeholder="••••••••" required="" type="password"/>
        <p class="login-error" hidden="" id="mensaje-error">
        </p>
        <button class="btn btn-primario" id="btn-email" type="submit">
         Iniciar sesión
        </button>
       </form>
       <div class="login-divisor">
        <span>
         o
        </span>
       </div>
       <button class="btn btn-google" id="btn-google">
        <svg aria-hidden="true" height="18" viewbox="0 0 48 48" width="18">
         <path d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" fill="#EA4335">
         </path>
         <path d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" fill="#4285F4">
         </path>
         <path d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" fill="#FBBC05">
         </path>
         <path d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" fill="#34A853">
         </path>
        </svg>
        Continuar con Google
       </button>
       <button class="btn btn-github" id="btn-github">
        <svg aria-hidden="true" fill="currentColor" height="18" viewbox="0 0 24 24" width="18">
         <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12">
         </path>
        </svg>
        Continuar con GitHub
       </button>
       <div class="login-divisor">
        <span>
         o
        </span>
       </div>
       <boton-invitado data-component="invitado">
        <template shadowrootmode="open">
         <slot>
         </slot>
        </template>
        <button class="btn css-inline-ed289ea53b" id="btn-invitado" type="button">
         <span class="css-inline-4f1925a8a6">
          👤
         </span>
         Entrar como Invitado
        </button>
       </boton-invitado>
      </div>
     </main>
    </login-form>
   </section>
  </app-view-login>
 <script src="../../../js/descargas/notificador.js?v=20260911-0930"></script>
</body>
</html>
