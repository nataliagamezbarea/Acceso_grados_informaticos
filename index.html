  <script>
  /* BASE DE LA APLICACION (debe ir antes de cualquier recurso relativo).
     Se calcula al cargar para que el mismo codigo funcione en la raiz
     (localhost, dominio propio, usuario.github.io) y en un GitHub Pages de
     proyecto (usuario.github.io/repositorio/). Sin build ni reescritura. */
  (function () {
    var base = '/';
    try {
      if (/\.github\.io$/i.test(location.hostname)) {
        var seg = location.pathname.split('/')[1] || '';
        var propias = /^(paginas|componentes|css|js|img|visores|sql|bibliotecas_latex|index\.html|login\.html)$/i;
        if (seg && !propias.test(seg)) base = '/' + seg + '/';
      }
    } catch (_) {}
    window.APP_BASE = base;
    document.write('<base href="' + base + '">');
  }());
  </script>
